version: 2
updates:
  # GitHub Actions (they are pinned to commit SHAs, Dependabot bumps them)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # base images in the Dockerfiles (they are pinned to sha256 digests)
  - package-ecosystem: "docker"
    directories: ["/vote", "/result", "/worker"]
    schedule:
      interval: "weekly"

  # application dependencies
  - package-ecosystem: "pip"
    directory: "/vote"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/result"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directory: "/worker"
    schedule:
      interval: "weekly"
