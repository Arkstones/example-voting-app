# Postgres login, read by db, worker and result through secretKeyRef.
# The password comes from --set db.password=... at install time
# (in CI: from the POSTGRES_PASSWORD GitHub secret), never from Git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    {{- include "uga-vote.labels" (dict "root" $ "component" "db") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.db.user | quote }}
  password: {{ required "db.password is required: pass it with --set db.password=..." .Values.db.password | quote }}
