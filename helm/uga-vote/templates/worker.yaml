# worker: takes votes off the Redis queue and saves them in Postgres.
# It has no web port, so there is no Service and no HTTP health check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "uga-vote.labels" (dict "root" $ "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "uga-vote.selectorLabels" (dict "root" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uga-vote.labels" (dict "root" $ "component" "worker") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/db-secret.yaml") . | sha256sum }}
    spec:
      # uid/gid 1654 is the built-in "app" user of the .NET images
      {{- include "uga-vote.podSecurity" (dict "uid" 1654 "gid" 1654) | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "uga-vote.image" (dict "root" $ "component" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "uga-vote.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          env:
            - name: REDIS_HOST
              value: redis
            # which database to write to; the "bad release" demo breaks this
            - name: DB_HOST
              value: {{ .Values.worker.dbHost | quote }}
            - name: DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: password }
            # workstation garbage collector: uses much less memory than the
            # server one, which matters on small 4 GiB nodes
            - name: DOTNET_gcServer
              value: "0"
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
