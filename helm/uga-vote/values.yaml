# Settings for the uga-vote chart. This is the only values file.
#
# Two values must be given at install time and are never stored in Git:
#   image.tag    the commit SHA the images were built from (CI sets it)
#   db.password  the Postgres password (CI passes it from a GitHub secret)

image:
  # images built and pushed by the GitHub Actions pipeline
  registry: ghcr.io/arkstones/uga-vote
  tag: ""
  pullPolicy: IfNotPresent

# the two choices on the vote and result pages
options:
  a: Kampala
  b: Entebbe

vote:
  replicas: 2
  service:
    # LoadBalancer = AWS gives the page a public URL
    type: LoadBalancer
    port: 80
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

result:
  # one replica: the live updates use socket.io, which keeps a connection
  # per browser and would need sticky sessions with more replicas
  replicas: 1
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

worker:
  replicas: 1
  # name of the database service the worker writes votes to
  dbHost: db
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

redis:
  # same pinned image as docker-compose.yml
  image: redis:7.4-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

db:
  # same pinned image as docker-compose.yml
  image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
  user: postgres
  name: postgres
  password: ""
  storage:
    # an EBS disk, so votes survive the database pod restarting
    size: 1Gi
    # empty = the cluster's default storage class (gp3, from k8s/cluster-setup.yaml)
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
